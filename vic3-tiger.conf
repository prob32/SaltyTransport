# vic3-tiger configuration for SaltyTransport.
# Reference: https://github.com/amtep/tiger/blob/main/filter.md

languages = {
	check = "english"
}

filter = {
	trigger = {
		# --- Variable maps (game 1.13.7+) are unknown to tiger v1.19.0. ---
		# Its parser breaks on `variable_map(name|key)` and the failure
		# cascades into phantom parse/name/prefix/structure/macro reports
		# throughout every file that touches maps. Structural soundness of
		# these files is covered by tools/lint_pdx.py and the in-game probe
		# (stl_probe_variable_maps). REMOVE this block once tiger
		# understands variable maps, and re-triage.
		NOT = { text = "variable_map" }
		ignore_keys_in_files = {
			keys = {
				parse-error
				name-conflict
				prefixes
				structure
				unknown-field
				macro
				strict-scopes
				scopes
			}
			files = {
				common/scripted_effects/stl_phase_b_generated.txt
				common/scripted_effects/stl_phase_c_generated.txt
				common/scripted_effects/stl_distance_cache.txt
				common/scripted_effects/stl_gravity_calculation.txt
				common/scripted_effects/stl_tooltip_effects.txt
				common/scripted_effects/stl_probe.txt
				common/script_values/stl_gui_values.txt
				# no maps in these two, but the phantom `market`/`set_variable`
				# effects fabricated by the cascade poison their analysis
				common/scripted_effects/stl_building_management.txt
				common/scripted_guis/stl_scripted_guis.txt
			}
		}
		# The parse cascade above also fabricates phantom scripted effects
		# named after builtins (`market`, `set_variable`, ...), which poisons
		# macro/flow analysis in files that never touch maps. Suppress those
		# two report shapes globally; the generated dispatcher passes macro
		# args in lockstep with the effects it calls, so the blind spot is
		# acceptable until tiger parses maps.
		NOT = { AND = { key = macro text = "does not need macro arguments" } }
		NOT = { AND = { key = macro text = "needs parameter" } }
		NOT = { AND = { key = strict-scopes text = "local_var:stl_hub_count" } }

		# --- gfx/ was not uploaded to the validation container (binary
		# assets, not needed otherwise). Re-enable once a gfx file listing
		# is available to verify icon paths against.
		NAND = {
			key = missing-file
			text = "gfx/"
		}
	}
}

# Tiger cannot infer the type of saved scopes created inside scope blocks.
scope_override = {
	stl_bf_market = market
}
