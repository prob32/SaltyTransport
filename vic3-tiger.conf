# vic3-tiger configuration for SaltyTransport.
# Reference: https://github.com/amtep/tiger/blob/main/filter.md

languages = {
	check = "english"
}

filter = {
	trigger = {
		# --- Variable maps (game 1.13.7+) are unknown to tiger v1.19.0. ---
		# The mod's only remaining map user is the syntax probe (the storage
		# layer runs on plain variables after the live discovery that map
		# values are stored by reference). Tiger cannot tokenize
		# `variable_map(...)`; the probe's parse breakage also fabricates
		# phantom effects named after builtins that can poison macro/flow
		# analysis in other files, hence the two global shapes below.
		# Remove all of this once tiger learns maps.
		NOT = { text = "variable_map" }
		ignore_keys_in_files = {
			keys = {
				parse-error
				name-conflict
				prefixes
				structure
				unknown-field
				macro
				strict-scopes
				scopes
			}
			files = {
				common/scripted_effects/stl_probe.txt
			}
		}
		NOT = { AND = { key = macro text = "does not need macro arguments" } }
		NOT = { AND = { key = macro text = "needs parameter" } }
		NOT = { AND = { key = strict-scopes text = "local_var" } }

		# --- gfx/ was not uploaded to the validation container (binary
		# assets, not needed otherwise). Re-enable once a gfx file listing
		# is available to verify icon paths against.
		NAND = {
			key = missing-file
			text = "gfx/"
		}
	}
}
